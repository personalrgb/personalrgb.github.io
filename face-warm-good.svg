<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- 웜톤 Good: 노란빛 혈색 도는 생기, 다크서클이 브라운톤으로 묻힘, 매끈한 피부, 밝은 미소 -->
  <ellipse cx="100" cy="120" rx="62" ry="76" fill="#f6e6bd" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="42" cy="120" rx="10" ry="16" fill="#f6e6bd" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="158" cy="120" rx="10" ry="16" fill="#f6e6bd" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M50 62 Q100 28 150 62 Q150 42 100 38 Q50 42 50 62 Z" fill="#4a3624"/>
  <!-- 눈썹: 살짝 올라감 -->
  <path d="M64 100 Q78 94 92 99" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M108 99 Q122 94 136 100" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- 은은한 혈색(볼) -->
  <ellipse cx="66" cy="146" rx="10" ry="6.5" fill="#e8a86a" opacity="0.45"/>
  <ellipse cx="134" cy="146" rx="10" ry="6.5" fill="#e8a86a" opacity="0.45"/>
  <!-- 눈: 반짝임 하이라이트 -->
  <ellipse cx="78" cy="118" rx="5" ry="5.5" fill="#2b2b2b"/>
  <circle cx="80" cy="116" r="1.4" fill="#ffffff"/>
  <ellipse cx="122" cy="118" rx="5" ry="5.5" fill="#2b2b2b"/>
  <circle cx="124" cy="116" r="1.4" fill="#ffffff"/>
  <!-- 다크서클이 브라운톤으로 묻힘: 아주 옅게만 -->
  <path d="M68 132 Q78 138 88 132" stroke="#c9a876" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M112 132 Q122 138 132 132" stroke="#c9a876" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- 코 -->
  <path d="M100 116 L96 146 Q100 150 104 146" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 미소 -->
  <path d="M76 162 Q100 180 124 162" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
