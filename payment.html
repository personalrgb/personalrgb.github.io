<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결제하기 | Personal RGB</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-palette.png">
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --accent: #1a1a1a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 80px; }
  a.back {
    display: inline-flex; align-items: center; gap: 4px;
    margin-bottom: 20px; font-size: 13px; color: var(--muted);
    text-decoration: none;
  }
  a.back:hover { color: var(--fg); }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 0 0 12px; letter-spacing: 0.02em;
  }

  .products { display: flex; flex-direction: column; gap: 8px; }
  .product {
    display: block; padding: 12px; border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .product.selected { border-color: var(--accent); background: #fafafa; }
  .product input { display: none; }
  .product .row { display: flex; align-items: center; gap: 12px; }
  .product .name { flex: 1; font-size: 15px; font-weight: 500; }
  .product .price { font-size: 15px; font-weight: 600; }
  .product .desc { margin-top: 4px; font-size: 12px; color: var(--muted); }

  label.field { display: block; margin-bottom: 12px; }
  label.field:last-child { margin-bottom: 0; }
  label.field span {
    display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px;
  }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%; padding: 11px 12px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; background: #fff; color: var(--fg);
  }
  input:focus { outline: none; border-color: var(--accent); }

  .methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .method {
    padding: 12px; text-align: center; font-size: 14px; font-weight: 500;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .method.selected { border-color: var(--accent); background: #fafafa; font-weight: 600; }
  .method input { display: none; }

  .total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 16px 2px 20px; font-size: 15px;
  }
  .total strong { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

  button.pay {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--accent); border: none;
    border-radius: var(--radius); cursor: pointer; font-family: inherit;
  }
  button.pay:disabled { background: #c4c4c4; cursor: not-allowed; }

  .agree {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--muted); margin: 0 2px 16px;
  }
  .agree input { margin: 3px 0 0; accent-color: var(--accent); }
  .agree a { color: var(--muted); }

  .msg {
    margin-top: 14px; padding: 12px; border-radius: 8px;
    font-size: 14px; display: none; white-space: pre-wrap;
  }
  .msg.error { display: block; background: #fef2f2; color: #b91c1c; }
  .msg.ok { display: block; background: #f0fdf4; color: #15803d; }

  footer {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); line-height: 1.8;
  }
  footer .biz { margin: 0; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html" id="backLink">← 뒤로</a>

  <h1>결제하기</h1>
  <p class="sub">Personal RGB 퍼스널 컬러 진단</p>

  <!-- 상품 -->
  <div class="card">
    <h2>상품</h2>
    <div class="products">
      <label class="product selected">
        <input type="radio" name="product" value="basic" data-name="퍼스널 컬러 진단 결과지" data-amount="1000" checked>
        <div class="row">
          <span class="name">기본</span>
          <span class="price">1,000원</span>
        </div>
        <div class="desc">웜톤·쿨톤부터 16타입까지, 퍼스널컬러 진단 결과지</div>
      </label>
      <label class="product">
        <input type="radio" name="product" value="styling" data-name="퍼스널 컬러 진단 결과지 + 스타일링 가이드" data-amount="2000">
        <div class="row">
          <span class="name">스타일링</span>
          <span class="price">2,000원</span>
        </div>
        <div class="desc">결과지에 어울리는 의상·헤어 스타일링 가이드를 더한다</div>
      </label>
      <label class="product">
        <input type="radio" name="product" value="full" data-name="퍼스널 컬러 진단 결과지 + 전체 스타일링 가이드" data-amount="2500">
        <div class="row">
          <span class="name">풀 패키지</span>
          <span class="price">2,500원</span>
        </div>
        <div class="desc">의상·메이크업·헤어·주얼리·네일까지 전체 스타일링 가이드를 모두 담는다</div>
      </label>
    </div>
  </div>

  <!-- 구매자 정보 -->
  <div class="card">
    <h2>구매자 정보</h2>
    <label class="field">
      <span>이름</span>
      <input type="text" id="buyerName" placeholder="홍길동" autocomplete="name">
    </label>
    <label class="field">
      <span>휴대폰 번호</span>
      <input type="tel" id="buyerTel" placeholder="01012345678" autocomplete="tel">
    </label>
    <label class="field">
      <span>이메일</span>
      <input type="email" id="buyerEmail" placeholder="example@email.com" autocomplete="email">
    </label>
  </div>

  <!-- 결제수단 -->
  <div class="card">
    <h2>결제수단</h2>
    <div class="methods">
      <label class="method selected">
        <input type="radio" name="method" value="card" checked>신용카드
      </label>
      <label class="method">
        <input type="radio" name="method" value="kakaopay">카카오페이
      </label>
    </div>
  </div>

  <div class="total">
    <span>총 결제금액</span>
    <strong id="totalAmount">1,000원</strong>
  </div>

  <label class="agree">
    <input type="checkbox" id="agree">
    <span>
      <a href="./terms.html" target="_blank">이용약관</a> 및
      <a href="./privacy.html" target="_blank">개인정보처리방침</a>에 동의하며,
      결제 진행에 동의합니다.
    </span>
  </label>

  <button class="pay" id="payBtn">결제하기</button>
  <div class="msg" id="msg"></div>

  <footer>
    <p class="biz">
      상호: 원(WON) &nbsp;|&nbsp; 대표: 김예원<br>
      사업자등록번호: 805-71-00569<br>
      사업장 주소: 경기도 화성시 병점구 동탄지성로 294<br>
      전화: 010-3040-5204 &nbsp;|&nbsp; 문의: moyah1128@gmail.com<br>
      결제대행: NHN KCP / KG이니시스 (포트원)<br>
      <a href="./terms.html">이용약관/환불정책</a> · <a href="./privacy.html">개인정보처리방침</a>
    </p>
  </footer>

</div>

<script>
/* ─────────────────────────────────────────────
   포트원 설정 — 관리자 콘솔 > 연동 정보에서 복사
   https://admin.portone.io/integration-v2/manage/channel
   ───────────────────────────────────────────── */
// season은 결과지를 어떤 타입으로 열어야 하는지 나타낸다(index.html의
// pendingFinalSeason) — 상품 선택 전 결제 카드에서 "?season=..."으로 넘어온다.
const URL_PARAMS = new URLSearchParams(location.search);
const TIER_PARAM = URL_PARAMS.get("tier");
const SEASON_PARAM = URL_PARAMS.get("season");
const RETURN_BASE = location.origin + location.pathname.replace(/payment\.html$/, "");

const PORTONE_CONFIG = {
  storeId: "store-42b98514-2507-4ed6-b090-fed3d2c9a149",
  channelKey: {
    card:     "channel-key-ccf6537a-ca27-4b7f-b7b0-95c361cc6c49",
    kakaopay: "channel-key-96043aa3-67dd-4993-ac05-202d1de8bb87",
  },
  // 모바일 결제는 이 주소로 돌아온다. season이 있으면(실제 진단을 마치고 온
  // 경우) 바로 index.html로 돌려보내 결과지를 열게 하고, 없으면(결제 테스트
  // 페이지를 직접 열어 들어온 경우) payment-complete.html로 보낸다.
  redirectUrl: SEASON_PARAM !== null
    ? RETURN_BASE + "index.html?season=" + encodeURIComponent(SEASON_PARAM)
    : RETURN_BASE + "payment-complete.html",
};

/* ── UI 동작 ────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// 앱 안에서 결제 화면으로 넘어온 경우엔 브라우저 히스토리로 원래
// 화면(진단 결과지 등)으로 돌아가고, 이 페이지를 직접 열어서
// 뒤로 갈 곳이 없는 경우에만 홈으로 이동한다.
document.getElementById("backLink").addEventListener("click", (e) => {
  if (history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

function syncSelected(groupSelector, itemSelector) {
  $$(groupSelector).forEach((input) => {
    input.addEventListener("change", () => {
      $$(itemSelector).forEach((el) => el.classList.remove("selected"));
      input.closest(itemSelector).classList.add("selected");
      updateTotal();
    });
  });
}
syncSelected('input[name="method"]', ".method");
syncSelected('input[name="product"]', ".product");

function selectedProduct() {
  const el = $('input[name="product"]:checked');
  return { name: el.dataset.name, amount: Number(el.dataset.amount) };
}

function updateTotal() {
  $("#totalAmount").textContent = selectedProduct().amount.toLocaleString("ko-KR") + "원";
}

function showMsg(text, type) {
  const el = $("#msg");
  el.textContent = text;
  el.className = "msg " + type;
}

// 주문번호 생성 (중복되면 결제 실패하므로 매번 새로 생성)
function makePaymentId() {
  const d = new Date();
  const stamp =
    d.getFullYear() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0") +
    String(d.getHours()).padStart(2, "0") +
    String(d.getMinutes()).padStart(2, "0") +
    String(d.getSeconds()).padStart(2, "0");
  const rand = Math.random().toString(36).slice(2, 8);
  return `prgb-${stamp}-${rand}`;
}

/* ── 결제 요청 ──────────────────────────────── */
$("#payBtn").addEventListener("click", async () => {
  const name = $("#buyerName").value.trim();
  const tel = $("#buyerTel").value.replace(/[^0-9]/g, "");
  const email = $("#buyerEmail").value.trim();
  const method = $('input[name="method"]:checked').value;
  const product = selectedProduct();

  // KG이니시스는 이름·연락처·이메일이 필수값
  if (!name)  return showMsg("이름을 입력해 주세요.", "error");
  if (!tel)   return showMsg("휴대폰 번호를 입력해 주세요.", "error");
  if (!email) return showMsg("이메일을 입력해 주세요.", "error");
  if (!$("#agree").checked) return showMsg("약관에 동의해 주세요.", "error");

  const btn = $("#payBtn");
  btn.disabled = true;
  btn.textContent = "결제창을 여는 중…";
  showMsg("", "");

  try {
    // redirectUrl은 모바일 브라우저에서 결제창이 리다이렉트 방식으로 열릴 때만
    // 쓰인다. PC의 HTML5_INICIS 카드결제는 팝업 + Promise 응답 방식이라
    // redirectUrl을 같이 보내면 "지원하지 않는 기능" 파싱 에러가 났다 —
    // 모바일에서만 포함시킨다.
    const isMobileBrowser = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const requestPayload = {
      storeId: PORTONE_CONFIG.storeId,
      channelKey: PORTONE_CONFIG.channelKey[method],
      paymentId: makePaymentId(),
      orderName: product.name,
      totalAmount: product.amount,
      currency: "CURRENCY_KRW",
      payMethod: method === "kakaopay" ? "EASY_PAY" : "CARD",
      customer: {
        fullName: name,
        phoneNumber: tel,
        email: email,
      },
    };
    if (isMobileBrowser) {
      requestPayload.redirectUrl = PORTONE_CONFIG.redirectUrl;
    }
    const response = await PortOne.requestPayment(requestPayload);

    // PC 환경에서는 여기로 결과가 돌아옴 (모바일은 redirectUrl로 이동)
    if (response.code !== undefined) {
      showMsg("결제에 실패했습니다.\n" + response.message, "error");
    } else {
      showMsg("결제를 확인하는 중…", "ok");
      // 프론트엔드가 "성공했다"고 보내는 응답만 믿으면 조작 가능하므로, 서버
      // (netlify/functions/verify-payment.js)에 paymentId로 다시 조회해서
      // 실제로 결제된 금액이 맞는지 확인한 뒤에만 결과지로 돌려보낸다.
      let verifyOk = false;
      try {
        const verifyRes = await fetch("/.netlify/functions/verify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentId: response.paymentId }),
        });
        verifyOk = (await verifyRes.json()).ok === true;
      } catch (err) {
        verifyOk = false;
      }
      if (verifyOk && SEASON_PARAM !== null) {
        location.href = RETURN_BASE + "index.html?season=" + encodeURIComponent(SEASON_PARAM) +
          "&paymentId=" + encodeURIComponent(response.paymentId);
        return;
      } else if (verifyOk) {
        showMsg("결제가 완료되었습니다.\n주문번호: " + response.paymentId, "ok");
      } else {
        showMsg("결제 확인에 실패했습니다. 고객센터(moyah1128@gmail.com)로 문의해 주세요.\n주문번호: " + response.paymentId, "error");
      }
    }
  } catch (e) {
    showMsg("결제 중 오류가 발생했습니다.\n" + (e.message || e), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "결제하기";
  }
});

// 홈 화면 결제 카드에서 특정 상품을 눌러 들어온 경우(payment.html?tier=styling)
// 그 상품이 미리 선택된 채로 열리게 한다.
if (TIER_PARAM) {
  const el = document.querySelector(`input[name="product"][value="${TIER_PARAM}"]`);
  if (el) {
    el.checked = true;
    el.dispatchEvent(new Event("change"));
  }
}

updateTotal();
</script>
</body>
</html>
